name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build OhHangulKey (x64 /MT)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: MSVC x64 환경 설정
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 실행 파일 빌드 (build.bat)
        shell: cmd
        run: |
          build.bat

      - name: 빌드 산출물 확인
        shell: pwsh
        run: |
          Get-ChildItem -Path bin/OhHangulKey.exe | Select-Object Name, Length, LastWriteTime

      - name: 빌드 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: OhHangulKey-x64
          path: bin/OhHangulKey.exe
          if-no-files-found: error

      - name: GitHub Release 생성 및 바이너리 첨부 (태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/OhHangulKey.exe
          generate_release_notes: true
